<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2B8585">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="preload" href="/fonts/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <title>Sentinel</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Nav rail (left sidebar) -->
    <nav id="nav-rail" aria-label="Main navigation">
        <div class="nav-brand">
            <span class="nav-brand-text">Sentinel</span>
        </div>
        <!-- Nav items generated dynamically by core/router.js from registered views -->
        <div class="nav-items"></div>
        <div class="nav-footer">
            <span id="user-display-name" class="user-name"></span>
            <button type="button" class="nav-item" id="settings-btn" title="Settings" aria-label="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span class="nav-label">Settings</span>
            </button>
            <button type="button" class="nav-item" id="theme-toggle-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
                <svg class="theme-icon-light" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg class="theme-icon-dark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <span class="nav-label">Theme</span>
            </button>
            <button type="button" class="nav-status" id="nav-status-btn" title="System status">
                <span id="status-dot" class="status-dot"></span>
                <span class="nav-label" id="status-text">Connecting...</span>
            </button>
        </div>
    </nav>

    <!-- Main content area -->
    <div id="main-wrapper">
        <!-- Toast container -->
        <div id="toast-container" aria-live="polite"></div>

        <!-- PIN change banner (shown when must_change_pin is set) -->
        <div id="pin-banner" class="pin-banner" style="display:none;">
            Your PIN was set by an admin — please change it in Settings
        </div>

        <!-- View containers created dynamically by core/router.js -->
        <!-- Each view module renders its own HTML via registerView({ render }) -->

        <!-- Persistent input bar (visible on Chat view) -->
        <footer id="input-bar">
            <form id="input-form">
                <label for="task-input" class="sr-only">Describe a task</label>
                <input
                    type="text"
                    id="task-input"
                    placeholder="Ask me to do something…"
                    autocomplete="off"
                    disabled
                >
                <button type="submit" id="send-btn" disabled>Send</button>
            </form>
        </footer>
    </div>

    <!-- Settings overlay -->
    <div id="settings-overlay" class="settings-overlay" style="display:none;">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button" id="settings-close" class="settings-close" aria-label="Close settings">&times;</button>
            </div>
            <div class="settings-tabs" id="settings-tabs" role="tablist"></div>
            <div class="settings-content" id="settings-content" role="tabpanel"></div>
        </div>
    </div>

    <!-- marked.js is a non-module library — load before app.js uses it -->
    <script src="marked.min.js" defer
            integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
            crossorigin="anonymous"></script>

    <!-- Main application modules (type="module" — deferred, strict, scoped) -->
    <script type="module" src="app.js"></script>
    <script type="module" src="views/settings/settings.js"></script>
</body>
</html>
