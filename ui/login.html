<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2B8585">
    <title>Sentinel — Sign in</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/utilities.css">
    <link rel="stylesheet" href="styles/themes/dark.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-card">
        <div class="login-cherry" id="login-cherry"></div>
        <div class="login-brand">Sentinel</div>
        <h1 class="login-title">Good to see you</h1>
        <p class="login-subtitle">Enter your credentials to continue</p>
        <form id="login-form" method="POST" autocomplete="on">
            <label for="username" class="sr-only">Username</label>
            <input
                type="text"
                id="username"
                class="login-field"
                placeholder="Username"
                autocomplete="username"
                required
            >
            <label for="pin" class="sr-only">PIN</label>
            <input
                type="password"
                id="pin"
                class="login-field login-field-pin"
                placeholder="PIN"
                autocomplete="current-password"
                required
            >
            <button type="submit" class="login-btn" id="login-btn">Sign in</button>
        </form>
        <div id="login-error" class="login-error"></div>
    </div>

    <script type="module" src="/login.js"></script>
</body>
</html>
